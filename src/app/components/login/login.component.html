<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>PlugAndChat</h2>
      <p>Panel de Administración</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="tenantName">Inquilino (Alias)</label>
        <input
          id="tenantName"
          type="text"
          formControlName="tenantName"
          placeholder="Ej: lotorojo"
          [class.error]="loginForm.get('tenantName')?.touched && loginForm.get('tenantName')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@empresa.com"
          [class.error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
      </div>

      @if (errorMessage()) {
        <div class="error-banner">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="isLoading() || loginForm.invalid" class="btn-submit">
        @if (isLoading()) {
          <span class="spinner"></span> Procesando...
          } @else {
          Iniciar Sesión
        }
      </button>
    </form>
  </div>
</div>
